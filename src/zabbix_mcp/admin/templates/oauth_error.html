<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Authorization error - Zabbix MCP</title>
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
</head>
<body>
    <div class="login-page">
        <div class="theme-switcher-login">
            <button class="theme-btn" onclick="setTheme('light')" title="Light mode">&#x2600;&#xFE0F;</button>
            <button class="theme-btn" onclick="setTheme('auto')" title="Auto (system)">&#x1F5A5;&#xFE0F;</button>
            <button class="theme-btn" onclick="setTheme('dark')" title="Dark mode">&#x1F319;</button>
        </div>
        <div class="login-card">
            <div class="login-logo">
                <img src="/static/logo-symbol-color.svg" alt="Times of India" style="height: 56px;">
            </div>
            <h1 class="login-title">Authorization request invalid</h1>

            <div class="login-error">{{ message }}</div>

            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-top: 16px;">
                Close this window and start again from your MCP client.
            </p>
        </div>
        <div class="login-footer">
            &copy; {{ year }} Times of India
        </div>
    </div>

    <script>
    function setTheme(mode) {
        localStorage.setItem('theme', mode);
        applyTheme();
    }
    function applyTheme() {
        var saved = localStorage.getItem('theme') || 'auto';
        var resolved = saved === 'auto'
            ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
            : saved;
        document.documentElement.setAttribute('data-theme', resolved);
        document.querySelectorAll('.theme-btn').forEach(function(btn) { btn.classList.remove('active'); });
        var idx = {light: 0, auto: 1, dark: 2}[saved];
        if (idx !== undefined) document.querySelectorAll('.theme-btn')[idx].classList.add('active');
    }
    applyTheme();
    </script>
</body>
</html>
